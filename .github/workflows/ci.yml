name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Pruebas
        run: pytest
      - name: Dependencias vulnerables
        run: pip-audit --skip-editable
      - name: Migraciones y catálogo sobre una base limpia
        env:
          OPENFOOT_DATABASE_URL: sqlite:///./ci.db
        run: |
          openfoot init-db
          openfoot load-catalog data/catalog.yaml
          openfoot review list

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true
      - run: flutter pub get
      - name: Análisis estático
        run: flutter analyze
      - name: Pruebas
        run: flutter test
      - name: Compilar APK
        # Para tu propio servidor: define la variable de repositorio OPENFOOT_API_URL.
        run: >
          flutter build apk --release
          --dart-define=OPENFOOT_API_URL=${{ vars.OPENFOOT_API_URL || 'http://10.0.2.2:8000' }}
      - uses: actions/upload-artifact@v4
        with:
          name: openfoot-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
