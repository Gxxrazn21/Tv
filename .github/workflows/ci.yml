name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Pruebas
        run: pytest
      - name: Dependencias vulnerables
        run: pip-audit --skip-editable
      - name: Migraciones y catálogo sobre una base limpia
        env:
          OPENFOOT_DATABASE_URL: sqlite:///./ci.db
        run: |
          openfoot init-db
          openfoot load-catalog data/catalog.yaml
          openfoot review list

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Construir imagen del backend
        run: docker build -t openfoot-api backend
      - name: Arrancar y comprobar /health
        run: |
          docker run -d --name api -p 8000:8000 -e OPENFOOT_DATABASE_URL=sqlite:////tmp/openfoot.db openfoot-api
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/v1/competitions | python3 -c "import json,sys; d=json.load(sys.stdin); assert len(d) > 20, d; print(len(d), 'competiciones')"
      - name: Logs del contenedor
        if: always()
        run: docker logs api || true

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true
      - run: flutter pub get
      - name: Análisis estático
        run: flutter analyze
      - name: Pruebas
        run: flutter test
      - name: Compilar APK
        # Servidor por defecto del APK: la variable de repositorio OPENFOOT_API_URL o, si no
        # existe, el despliegue de Vercel del proyecto. Se puede cambiar en Ajustes → Servidor.
        run: >
          flutter build apk --release
          --dart-define=OPENFOOT_API_URL=${{ vars.OPENFOOT_API_URL || 'https://tv-backend-five.vercel.app' }}
      - uses: actions/upload-artifact@v5
        with:
          name: openfoot-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
