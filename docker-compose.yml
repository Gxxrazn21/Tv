# Despliegue autoalojado mínimo: PostgreSQL + backend. Uso: docker compose up --build
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: openfoot
      POSTGRES_USER: openfoot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el entorno}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfoot"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      OPENFOOT_DATABASE_URL: postgresql+psycopg://openfoot:${POSTGRES_PASSWORD}@db:5432/openfoot
      OPENFOOT_SCHEDULER_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
