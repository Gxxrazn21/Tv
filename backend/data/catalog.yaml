rights:
  # --- Verificadas: comunicado oficial de FIFA (inside.fifa.com) ----------------------------
  # El comunicado nombra a las emisoras por territorio, pero no detalla precio ni modalidad
  # de acceso: por eso access_type es "unknown" (no se presupone que sea en abierto).
  - &fifa_nordic
    {broadcaster: dr, competition: WC, country: DK, season: "2026", valid_from: 2026-06-11,
     valid_to: 2026-07-19, access_type: unknown, source_type: organizer_directory,
     source_url: "https://inside.fifa.com/media-releases/fifa-world-cup-2026-media-rights-awarded-in-the-nordic-territories",
     status: verified, verified_at: "2026-10-14T10:00:00+00:00",
     verified_by: "catalogo-inicial (búsqueda web)",
     territorial_notes: "Derechos adjudicados para el territorio indicado; consulta las condiciones del proveedor.",
     review_note: "Comunicado de FIFA localizado por búsqueda. Comprobación HTTP pendiente."}
  - {<<: *fifa_nordic, broadcaster: tv2-dk, country: DK}
  - {<<: *fifa_nordic, broadcaster: yle, country: FI}
  - {<<: *fifa_nordic, broadcaster: mtv-fi, country: FI}
  - {<<: *fifa_nordic, broadcaster: nrk, country: "NO"}
  - {<<: *fifa_nordic, broadcaster: tv2-no, country: "NO"}
  - {<<: *fifa_nordic, broadcaster: svt, country: SE}
  - {<<: *fifa_nordic, broadcaster: tv4, country: SE}

