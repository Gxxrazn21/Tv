# Catálogo inicial de OpenFoot.
#
# REGLAS (ver docs/catalogo-y-verificacion.md):
# - Solo las entradas con status: verified se muestran al público, y únicamente mientras su
#   verificación no haya caducado (OPENFOOT_VERIFICATION_TTL_DAYS, 30 días por defecto).
# - "verified" exige fuente (source_url), fecha (verified_at) y responsable (verified_by).
# - Las entradas pending_review documentan indicios encontrados que AÚN NO se han podido
#   confirmar contra la fuente oficial para la temporada en curso. No se publican.
# - Que un dominio parezca legítimo no basta: official_domains lo fija una persona tras revisar.
#
# Investigación realizada el 2026-10-14 mediante búsqueda web. Desde el entorno de desarrollo
# no se pudo descargar ninguna página (la red bloqueaba los dominios), así que ninguna entrada
# ha pasado todavía la comprobación HTTP (`openfoot check-links`). Ejecútala antes de publicar.

competitions:
  # --- Europa -------------------------------------------------------------------------------
